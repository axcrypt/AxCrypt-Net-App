name: dependency-review

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # GPLv3-compatible allow-list; extend only after verifying compatibility
          # and updating THIRD-PARTY-NOTICES.md.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, MS-PL, GPL-3.0-or-later, LGPL-3.0-or-later
          comment-summary-in-pr: on-failure
