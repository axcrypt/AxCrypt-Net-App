    <script>
        // Disable pinch-to-zoom
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gestureend', function (e) {
            e.preventDefault();
        });

        // Disable double-tap zoom
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        // Disable zoom on scroll (desktop)
        document.addEventListener('wheel', function (e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
    <script type="text/javascript">
        function isCssFileAdded(fileName, cssFilePath) {
            // Get all the <link> elements in the <head>
            const links = document.getElementsByTagName('link');

            // Loop through each <link> element
            for (let i = 0; i < links.length; i++) {
                if (links[i].rel === 'stylesheet' && links[i].href.endsWith(fileName)) {
                    links[i].href = cssFilePath;
                    return true;
                }
            }

            return false;
        }

        window.addCssFile = function (subsLvl, cssFileName) {
            var cssFile = "css/" + subsLvl + "/" + cssFileName;
            if (isCssFileAdded(cssFileName, cssFile)) {
                return;
            }

            var link = document.createElement("link");
            link.rel = "stylesheet";
            link.type = "text/css";
            link.href = cssFile;
            document.head.appendChild(link);
        };
    </script>
</head>

<script>
    function setupSwipe(dotNetHelper) {
        const carousel = document.getElementById("carousel-container");
        let touchstartX = 0;
        let touchendX = 0;

        carousel.addEventListener('touchstart', function (event) {
            touchstartX = event.changedTouches[0].screenX;
        }, false);

        carousel.addEventListener('touchend', function (event) {
            touchendX = event.changedTouches[0].screenX;
            handleSwipeGesture(dotNetHelper);
        }, false);

        function handleSwipeGesture(dotNetHelper) {
            const swipeThreshold = 50;
            if (touchendX < touchstartX - swipeThreshold) {
                dotNetHelper.invokeMethodAsync('OnSwipeLeft');
            } else if (touchendX > touchstartX + swipeThreshold) {
                dotNetHelper.invokeMethodAsync('OnSwipeRight');
            }
        }
    }
</script>
