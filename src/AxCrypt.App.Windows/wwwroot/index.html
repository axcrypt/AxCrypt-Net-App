    <script type="text/javascript">
        window.setTheme = function (theme) {
            document.documentElement.setAttribute("data-theme", theme);
            if (theme == "dark") {
                addDarkThemeCssFile("css/darktheme.min.css", "darktheme.min.css");
            }
            else {
                removeDarkThemeCssFile();
            }
        };

        window.setHtmlLang = function (lang) {
            if (!lang) return;
            document.documentElement.setAttribute("lang", lang);
        };

        function enablePopup() {
            DotNet.invokeMethodAsync("AxCrypt", "EnablePopup");
        }

        // Disable pinch-to-zoom
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gestureend', function (e) {
            e.preventDefault();
        });

        // Disable double-tap zoom
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        // Disable zoom on scroll (desktop)
        document.addEventListener('wheel', function (e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });

        function isCssFileAdded(fileName, cssFilePath) {
            // Get all the <link> elements in the <head>
            const links = document.getElementsByTagName('link');

            // Loop through each <link> element
            for (let i = 0; i < links.length; i++) {
                if (links[i].rel === 'stylesheet' && links[i].href.endsWith(fileName)) {
                    links[i].href = cssFilePath;
                    return true;
                }
            }

            return false;
        }

        window.isCssApplied = function (cssBasePath, cssFile) {
            const link = document.querySelector(`link[href*='${cssBasePath}/${cssFile}']`);
            return link && link.sheet ? true : false;
        }

        function internalAddCss(cssFilePath, id) {
            var link = document.createElement("link");
            link.rel = "stylesheet";
            link.type = "text/css";
            link.href = cssFilePath;

            if (id && id.length > 0) {
                link.id = id;
            }

            document.head.appendChild(link);
            return true;
        }

        window.addCssFile = function (subsLvl, cssFileName) {
            var cssFile = "css/" + cssFileName;
            if (subsLvl && subsLvl.length > 0) {
                cssFile = "css/" + subsLvl + "/" + cssFileName;
            }
            if (isCssFileAdded(cssFileName, cssFile)) {
                return true;
            }

            return internalAddCss(cssFile, "");
        };

        window.addDarkThemeCssFile = function (cssFilePath, cssFileName) {
            if (isCssFileAdded(cssFileName, cssFilePath)) {
                return;
            }

            internalAddCss(cssFilePath, "dark-theme-style-link");
        };

        window.removeDarkThemeCssFile = function () {
            var linkElement = document.getElementById("dark-theme-style-link");
            if (linkElement) {
                linkElement.parentNode.removeChild(linkElement);
            }
        };

        // Clamps an absolutely/fixed-positioned popover (typically a
        // context menu) so it can never spill off the right or bottom
        // edge of the viewport. Called from Blazor after the popup
        // renders at the cursor position. Idempotent — safe to call
        // on every re-render.
        window.clampToViewport = function (elementId) {
            var el = document.getElementById(elementId);
            if (!el) return;
            // Reset any previous nudge before measuring so we get the
            // true natural rect each time.
            el.style.transform = "";
            requestAnimationFrame(function () {
                var r = el.getBoundingClientRect();
                var margin = 8;
                var vw = document.documentElement.clientWidth || window.innerWidth;
                var vh = document.documentElement.clientHeight || window.innerHeight;
                var dx = 0, dy = 0;
                if (r.right > vw - margin) dx = (vw - margin) - r.right;
                if (r.bottom > vh - margin) dy = (vh - margin) - r.bottom;
                if (r.left + dx < margin) dx = margin - r.left;
                if (r.top + dy < margin) dy = margin - r.top;
                if (dx !== 0 || dy !== 0) {
                    el.style.transform = "translate(" + dx + "px," + dy + "px)";
                }
            });
        };
    </script>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <!--
        Bootstrap loader — visually identical to the in-app AxLoader so
        the boot sequence and the post-sign-in loader feel like the same
        wheel. Uses the same axcryptIcon.png with the same spin + breathe
        animations. Inlined here so it paints BEFORE any CSS bundle loads.
    -->
    <style>
        #boot-loader {
            position: fixed;
            inset: 0;
            z-index: 99997;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        html[data-theme="dark"] #boot-loader {
            background: #0F141A;
        }
        #boot-loader .axl-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        #boot-loader .axl-logo {
            width: 84px;
            height: 84px;
            animation: bl-breathe 1.4s ease-in-out infinite;
        }
        #boot-loader .axl-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            animation: bl-spin 1.4s linear infinite;
        }
        @keyframes bl-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes bl-breathe {
            0%, 100% { transform: scale(0.95); }
            50%      { transform: scale(1); }
        }
        #boot-loader .axl-msg {
            font-size: 14px;
            color: #111827;
            font-weight: 500;
            text-align: center;
            max-width: 240px;
            line-height: 1.5;
        }
        html[data-theme="dark"] #boot-loader .axl-msg {
            color: #E8ECF1;
        }
        /* Soft brand glow under the icon in dark mode — matches the
           AxLoader's dark-mode rule. */
        html[data-theme="dark"] #boot-loader .axl-logo-img {
            filter: brightness(1.05) drop-shadow(0 1px 6px rgba(127, 204, 92, 0.25));
        }
        @media (prefers-reduced-motion: reduce) {
            #boot-loader .axl-logo,
            #boot-loader .axl-logo-img {
                animation: bl-fade 1.6s ease-in-out infinite;
            }
        }
        @keyframes bl-fade {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.5; }
        }
    </style>

    <div id="app">
        <!-- Bootstrap loader — pre-Blazor, paints exactly like the in-app
             AxLoader so the boot → home transition is a single brand wheel
             instead of two different ones. -->
        <div id="boot-loader" role="status" aria-live="polite" aria-label="Loading">
            <div class="axl-stack">
                <div class="axl-logo" aria-hidden="true">
                    <img class="axl-logo-img" src="images/axcryptIcon.png" alt="" />
                </div>
                <div class="axl-msg">Just a moment…</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/helpoverlay.js"></script>
</body>

<script>
    function setupSwipe(dotNetHelper) {
        const carousel = document.getElementById("carousel-container");
        let touchstartX = 0;
        let touchendX = 0;

        carousel.addEventListener('touchstart', function (event) {
            touchstartX = event.changedTouches[0].screenX;
        }, false);

        carousel.addEventListener('touchend', function (event) {
            touchendX = event.changedTouches[0].screenX;
            handleSwipeGesture(dotNetHelper);
        }, false);

        function handleSwipeGesture(dotNetHelper) {
            const swipeThreshold = 50;
            if (touchendX < touchstartX - swipeThreshold) {
                dotNetHelper.invokeMethodAsync('OnSwipeLeft');
            } else if (touchendX > touchstartX + swipeThreshold) {
                dotNetHelper.invokeMethodAsync('OnSwipeRight');
            }
        }
    }
</script>
