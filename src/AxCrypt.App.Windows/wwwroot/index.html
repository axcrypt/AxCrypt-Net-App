<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AxCrypt</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="AxCrypt.App.Windows.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <script>
        function enablePopup() {
            DotNet.invokeMethodAsync("AxCrypt.MauiBlazor.Windows", "EnablePopup");
        }
    </script>
    <script>
        // Disable pinch-to-zoom
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gestureend', function (e) {
            e.preventDefault();
        });

        // Disable double-tap zoom
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        // Disable zoom on scroll (desktop)
        document.addEventListener('wheel', function (e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
    <script>
        window.addCssFile = function (cssPath) {
            var link = document.createElement("link");
            link.href = cssPath;
            link.rel = "stylesheet";
            document.head.appendChild(link);
        };
    </script>
</head>

<body>

    <div class="status-bar-safe-area"></div>

<script>
    function setupSwipe(dotNetHelper) {
        const carousel = document.getElementById("carousel-container");
        let touchstartX = 0;
        let touchendX = 0;

        carousel.addEventListener('touchstart', function (event) {
            touchstartX = event.changedTouches[0].screenX;
        }, false);

        carousel.addEventListener('touchend', function (event) {
            touchendX = event.changedTouches[0].screenX;
            handleSwipeGesture(dotNetHelper);
        }, false);

        function handleSwipeGesture(dotNetHelper) {
            const swipeThreshold = 50;
            if (touchendX < touchstartX - swipeThreshold) {
                dotNetHelper.invokeMethodAsync('OnSwipeLeft');
            } else if (touchendX > touchstartX + swipeThreshold) {
                dotNetHelper.invokeMethodAsync('OnSwipeRight');
            }
        }
    }
</script>
